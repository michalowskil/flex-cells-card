  left: 7
custom_template_enabled: true
custom_template_html: |-
  <style>
  .bar {
    display: block;
    box-sizing: border-box;
    background-color: currentColor;
    height: 6px;
    border-radius: 50px;
    border: 1px solid black;
    width: calc(abs(var(--temp)) / var(--temp-max) * 100%);
  }
  </style>
  <div style="--temp-max: max(0.1,
    abs(<fcc entity='sensor.atc_salon_temperature' raw />),
    abs(<fcc entity='sensor.atc_kuchnia_temperature' raw />),
    abs(<fcc entity='sensor.kabina_prysznicowa_temperature' raw />),
    abs(<fcc entity='sensor.atc_sypialnia_temperature' raw />),
    abs(<fcc entity='weather.forecast_dom' attr='temperature' raw />),
    abs(<fcc entity='sensor.balkon_na_zewnatrz_temperature' raw />),
    abs(<fcc entity='sensor.szafka_pod_biurkiem_temperature' raw />),
    abs(<fcc entity='sensor.szafka_pod_tv_temperature' raw />)
  )">
    <fcc />
  </div>
type: custom:flex-cells-card
