column_count: 5
card_padding: 10
overflow_x: true
header_from_first_row: false
zebra: false
narrow_breakpoint: ''
text_size: ''
cell_padding:
  top: 4
  right: 0
  bottom: 4
  left: 0
custom_template_enabled: true
custom_template_html: |-
  <style>
    .presets,
    .subwoofer,
    .sourceAndMode {
      font-size: 12px;
      display: flex;
      overflow: auto;
    }
    .sourceAndMode {
      display: block;
    }
    .presets > .fcc-template-cell,
    .subwoofer > .fcc-template-cell {
      border: 1px solid grey;
      padding: 0 10px !important;
    }
    .presets > .fcc-template-cell:not(:first-child, :last-child),
    .subwoofer > .fcc-template-cell:not(:first-child, :last-child){
      border-left: none;
      padding: 0 10px;
    }
    .presets > .fcc-template-cell:nth-child(2),
    .subwoofer > .fcc-template-cell:nth-child(2) {
      border-top-left-radius: 10px;
      border-bottom-left-radius: 10px;
      border-left-width: 1px !important;
      border-left: solid grey;
      margin-left: 4px;
    }
    .subwoofer > .fcc-template-cell:nth-child(2) {
      margin-left: 4px;
      border-left: 1px solid grey !important;
    }
    .presets > .fcc-template-cell:last-child,
    .subwoofer > .fcc-template-cell:last-child {
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;    
      border-left: none;
    }
    .title {
      width: 70px !important;
    }
    .sourceAndMode .title {
      display: inline-block;
    }
    .sourceCell {
      padding-bottom: 0 !important;
    }
    .modeCell {
      max-width: calc(100% - 75px) !important;
    }
    /* Target Input */
    .slider-input {
      margin-top: 6px;
      margin-bottom: 12px;
    }
    .slider-input input{
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }
    /* --- Webkit Browsers --- */
    .slider-input input::-webkit-slider-runnable-track {
      height: 40px;
      background: #0c4a6e;
      border-radius: 20px;
      border: 0px solid #cbd5e1;
      box-shadow: 0px 2px 0px rgba(0, 0, 0, 0.1);
    }
    .slider-input input::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 30px;
      width: 30px;
      background: #ffffff;
      border-radius: 30px;
      border: 4px solid #0284c7;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
      margin-top: 5px;
    }
    /* --- Firefox --- */
    .slider-input input::-moz-range-track {
      height: 40px;
      background: #0c4a6e;
      border-radius: 20px;
      border: 0px solid #cbd5e1;
      box-shadow: 0px 2px 0px rgba(0, 0, 0, 0.1);
    }
    .slider-input input::-moz-range-thumb {
      height: 30px;
      width: 30px;
      background: #ffffff;
      border-radius: 30px;
      border: 4px solid #0284c7;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
      background-color: var(--card-background-color);
    }
    .slider-input .ctrl-value {
      font-size: 12px;
      min-width: 35px;
      text-align: center;
    }
    .slider {
      display: flex;
      align-items: center;
    }
    .element1 {
      flex: 1;
      min-width: 0;
    }
    .slider .ctrl-wrap,
    .slider .ctrl-wrap input {
      width: 100% !important;
    }
    .vol-buttons {
      background-color: var(--secondary-background-color);
      border-radius: 10px;
      padding: 8px !important;
      margin-left: 10px
    }
    .header {
      display: grid;
      grid-template-columns: 45px; 
      grid-template-rows: 20px 20px; 
      gap: 0px;
    }
    .col-1 .fcc-template-cell {
      padding: 0 !important;
    }
    .col-1 .fcc-template-cell ha-state-icon {
      margin-top: -2px !important;
    }
    .col-1 {
      grid-row: span 2;
    }
    .col-2 {
      grid-column: 2;
      grid-row: 1;
      font-size: 14px
    }
    .col-2 .fcc-template-cell,
    .col-3 .fcc-template-cell {
      padding: 0 !important;
    }
    .col-3 {
      margin-top: -5px;
      grid-column: 2;
      grid-row: 2;
    }
    .col-4 {
      grid-column: 3;
      text-align: right
    }
  </style>

  <div class="header">
    <div class="col-1">
      <fcc row="5" col="1"" />
    </div>
    <div class="col-2">
      <fcc row="5" col="2" />
    </div>
    <div class="col-3">
      <fcc row="5" col="3" />
      <span style="<fcc mode='text' row='4' col='5' />"> &#x2027; <fcc row="5" col="4" /></span>
      <span style="<fcc mode='text' row='4' col='5' />"> &#x2027; <fcc row="3" col="1" /></span>
    </div>
    <div class="col-4">
      <fcc row="5" col="5" />
    </div>
  </div>
  <div style="<fcc mode='text' row='4' col='5' />">
    <div class="slider">
      <fcc row="4" col="1" class="slider-input element1" />
      <fcc row="4" col="4" class="slider-input vol-buttons" />
      <fcc row="4" col="3" class="slider-input vol-buttons" />
      <fcc row="4" col="2" class="slider-input vol-buttons" />
    </div>
    <div class="presets">
      <span class="title">Preset:</span>
      <fcc row="1" col="1" /> 
      <fcc row="1" col="2" />
      <fcc row="1" col="3" />
      <fcc row="1" col="4" />
    </div>
    <div class="sourceAndMode">
      <span class="title">Source:</span>
      <fcc row="3" col="3" class="sourceCell" />
      <br/>
      <span class="title">Mode:</span>
      <fcc row="3" col="2" class="modeCell" />
    </div>
    <div class="subwoofer">
      <span class="title">Subwoofer:</span>
      <fcc row="2" col="1" />
    </div>
  </div>
type: custom:flex-cells-card
